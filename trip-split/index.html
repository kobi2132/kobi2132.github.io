<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>חצי־חצי</title>
<meta name="description" content="רישום הוצאות משותפות בטיול וחישוב מי מעביר למי.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#eef3f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1a1e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="חצי־חצי">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: one-column phone app. Sticky header with the trip total, list of expenses as "receipt" rows, bottom tab bar, add-sheet slides up. */
:root{
  --bg:#eef3f4; --surface:#ffffff; --ink:#14262e; --muted:#5d7178; --line:#d5e0e3;
  --accent:#0d7a6f; --accent-ink:#ffffff; --sun:#f0a92e; --sun-soft:#fdf1da;
  --good:#1f8a4c; --bad:#c2412d; --soft:#e2eeee;
  --display:"Rubik","Arial Hebrew","Segoe UI",sans-serif;
  --body:"Assistant","Arial Hebrew","Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1a1e; --surface:#16262b; --ink:#e4eef0; --muted:#93a8ae; --line:#284047;
  --accent:#3cc1b1; --accent-ink:#06211e; --sun:#f3b84d; --sun-soft:#3a2f17;
  --good:#5fd08e; --bad:#ff7d68; --soft:#1d3237; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a1e; --surface:#16262b; --ink:#e4eef0; --muted:#93a8ae; --line:#284047;
  --accent:#3cc1b1; --accent-ink:#06211e; --sun:#f3b84d; --sun-soft:#3a2f17;
  --good:#5fd08e; --bad:#ff7d68; --soft:#1d3237; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink);margin:0;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{font-family:var(--body);font-size:16px;line-height:1.45;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.brand .trip{color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.sync.on{color:var(--accent)}
.sync.off{color:var(--bad)}
.linkbox{direction:ltr;font-size:13px}

.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-start:-30px;bottom:-40px;width:140px;height:140px;border:2px dashed currentColor;border-radius:50%;opacity:.18}
.hero .lbl{font-size:13px;opacity:.85;letter-spacing:.02em}
.hero .big{font-family:var(--display);font-size:34px;font-weight:800;line-height:1.1}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.16);border-radius:10px;padding:6px 10px;font-size:14px}
.hero .verdict{font-family:var(--display);font-weight:700;font-size:17px;background:var(--sun);color:#2a1d02;border-radius:12px;padding:10px 12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section-h h2{font-size:18px}
.muted{color:var(--muted)}
.small{font-size:13px}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day{padding:8px 14px;font-size:13px;color:var(--muted);background:var(--soft);font-weight:600}
.exp{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);text-align:start;background:none;border-inline:0;border-bottom:0;width:100%}
.day+.exp{border-top:0}
.exp .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--soft)}
.exp .t{min-width:0}
.exp .t b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .t span{font-size:13px;color:var(--muted)}
.exp .a{text-align:end}
.exp .a b{font-family:var(--display);font-weight:700;font-size:16px}
.exp .a span{display:block;font-size:12px;color:var(--muted)}
.exp.transfer .ic{background:var(--sun-soft)}

.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty .stamp{font-size:40px}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.5}

.fab{position:fixed;z-index:6;inset-inline-start:auto;left:max(20px,calc(env(safe-area-inset-left,0px) + 20px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:20px;border:0;background:var(--sun);color:#2a1d02;font-size:32px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18);display:grid;place-items:center}

nav.tabs{position:fixed;inset:auto 0 0;z-index:7;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:flex;gap:4px;width:100%;max-width:560px}
nav.tabs button{flex:1;border:0;background:none;padding:8px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted);font-weight:600}
nav.tabs button .i{font-size:20px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--soft)}

.person-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.person-row:first-of-type{border-top:0}
.person-row .n{font-weight:700}
.person-row .bal{font-family:var(--display);font-weight:700}
.pos{color:var(--good)} .neg{color:var(--bad)}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

.transfer-card{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:12px;border-radius:12px;background:var(--sun-soft);border:1px dashed var(--sun)}
.transfer-card .who{font-weight:700;font-size:17px}
.stack{display:flex;flex-direction:column;gap:10px}

.cat-row{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:6px 0}
.cat-row .bar{grid-column:2/-1}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,15,18,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-size:20px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px}
.amount-row{display:grid;grid-template-columns:1fr 110px;gap:8px}
.amount-row .inp.amt{font-family:var(--display);font-size:26px;font-weight:700;direction:ltr;text-align:right}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cats button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.cats button .e{font-size:20px}
.cats button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:700}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2>*{flex:1}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:14px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:10px}

.rate-row{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center}
.people-edit{display:flex;flex-direction:column;gap:8px}
.people-edit .pe{display:flex;gap:8px}
.people-edit .pe .inp{flex:1}
.x{border:0;background:var(--soft);border-radius:10px;width:44px;font-size:18px}
textarea.inp{min-height:110px;resize:vertical;font-size:14px}
#share-sec{scroll-margin-top:calc(70px + env(safe-area-inset-top,0px))}
.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>
<nav class="tabs" id="tabs" aria-label="ניווט"><div class="in">
  <button data-tab="list"><span class="i">🧾</span>הוצאות</button>
  <button data-tab="sum"><span class="i">⚖️</span>מי חייב למי</button>
  <button data-tab="set"><span class="i">⚙️</span>הגדרות</button>
</div></nav>
<button class="fab" id="fab" aria-label="הוספת הוצאה">+</button>
<div id="layer"></div>

<script>
(function(){
const CURRENCIES={ILS:{s:"₪",n:"שקל"},USD:{s:"$",n:"דולר"},EUR:{s:"€",n:"יורו"},GBP:{s:"£",n:"ליש״ט"},THB:{s:"฿",n:"באט"},JPY:{s:"¥",n:"ין"},CHF:{s:"CHF",n:"פרנק"},CZK:{s:"Kč",n:"קורונה צ׳כית"},HUF:{s:"Ft",n:"פורינט"},GEL:{s:"₾",n:"לארי"},TRY:{s:"₺",n:"לירה טורקית"},INR:{s:"₹",n:"רופי"},VND:{s:"₫",n:"דונג"},AED:{s:"د.إ",n:"דירהם"}};
const DEFAULT_RATES={ILS:1,USD:3.7,EUR:4.0,GBP:4.7,THB:0.11,JPY:0.025,CHF:4.2,CZK:0.16,HUF:0.01,GEL:1.37,TRY:0.11,INR:0.044,VND:0.00015,AED:1.0};
const CATS=[["food","🍽️","אוכל"],["stay","🏨","לינה"],["ride","🚕","תחבורה"],["fun","🎟️","אטרקציות"],["shop","🛍️","קניות"],["fuel","⛽","דלק"],["drink","🍻","בילוי"],["other","📦","אחר"]];
const CAT=Object.fromEntries(CATS.map(c=>[c[0],c]));
const LS_KEY="trip-split-v1";
const HOME_HOST="mysplit.jacob-apps.co.il";
const SYNC_URL=location.hostname===HOME_HOST?"/api/trips/":"https://"+HOME_HOST+"/api/trips/";
const APP_URL=location.origin+location.pathname;

let state={settings:null,expenses:[],deleted:{}};
let tab="list";
try{const t=localStorage.getItem(LS_KEY+":tab");if(t)tab=t}catch(e){}

let tripId=null,prefs={};
function loadLocal(){try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);state.settings=d.settings||null;state.expenses=d.expenses||[];state.deleted=d.deleted||{}}
  tripId=localStorage.getItem(LS_KEY+":trip");prefs=JSON.parse(localStorage.getItem(LS_KEY+":prefs")||"{}")||{}}catch(e){}
  if(state.settings){if(prefs.lastCurrency==null&&state.settings.lastCurrency)prefs.lastCurrency=state.settings.lastCurrency;delete state.settings.lastCurrency;delete state.settings.lastPayer}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));if(tripId)localStorage.setItem(LS_KEY+":trip",tripId);localStorage.setItem(LS_KEY+":prefs",JSON.stringify(prefs))}catch(e){}}
function newTripId(){const a=new Uint8Array(16);crypto.getRandomValues(a);return btoa(String.fromCharCode(...a)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ---- store ---- */
const store={
  async saveSettings(s){s.updatedAt=Date.now();state.settings=s;if(!tripId)tripId=newTripId();saveLocal();render();syncSoon()},
  async putExpense(e){e.updatedAt=Date.now();const i=state.expenses.findIndex(x=>x.id===e.id);if(i>=0)state.expenses[i]=e;else state.expenses.push(e);saveLocal();render();syncSoon()},
  async delExpense(id){state.expenses=state.expenses.filter(x=>x.id!==id);state.deleted[id]=Date.now();saveLocal();render();syncSoon()}
};

/* ---- sync with the server ---- */
const ts=e=>Number(e?.updatedAt||e?.createdAt||0);
function merge(a,b){
  const deleted={...(a.deleted||{})};Object.entries(b.deleted||{}).forEach(([k,v])=>{if(!deleted[k]||deleted[k]<v)deleted[k]=v});
  const byId=new Map();for(const e of [...(a.expenses||[]),...(b.expenses||[])]){if(!e||typeof e.id!=="string")continue;const c=byId.get(e.id);if(!c||ts(e)>ts(c))byId.set(e.id,e)}
  for(const [id,t] of Object.entries(deleted)){const c=byId.get(id);if(c&&t>=ts(c))byId.delete(id)}
  const sa=a.settings,sb=b.settings;const settings=!sa?sb||null:!sb?sa:(Number(sb.updatedAt||0)>Number(sa.updatedAt||0)?sb:sa);
  return {settings,expenses:[...byId.values()],deleted};
}
let syncState="idle",lastSync=0,syncing=false,again=false,syncTimer=null;
function syncSoon(){clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,400)}
async function syncNow(){
  if(!tripId)return;
  if(syncing){again=true;return}
  syncing=true;setSync("busy");
  try{
    const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),12000);
    const r=await fetch(SYNC_URL+encodeURIComponent(tripId)+"/sync",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({settings:state.settings,expenses:state.expenses,deleted:state.deleted}),signal:ctrl.signal});
    clearTimeout(to);
    if(!r.ok)throw new Error("http "+r.status);
    const remote=await r.json();
    const before=JSON.stringify([state.settings,state.expenses]);
    const m=merge(state,remote);state.settings=m.settings||state.settings;state.expenses=m.expenses;state.deleted=m.deleted;
    saveLocal();lastSync=Date.now();setSync("ok");
    if(location.hostname.endsWith("github.io")&&state.settings){location.replace("https://"+HOME_HOST+"/#join-"+tripId);return}
    if(JSON.stringify([state.settings,state.expenses])!==before&&!isTyping())render();
  }catch(e){setSync("off")}
  finally{syncing=false;if(again){again=false;syncSoon()}}
}
function isTyping(){const a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT")&&$("#app").contains(a)}
function setSync(st){syncState=st;const b=$("#sync-badge");if(b){b.className="sync "+(st==="ok"?"on":st==="off"?"off":"");b.textContent=syncLabel()}}
function syncLabel(){return syncState==="ok"?"● מסונכרן":syncState==="off"?"○ בלי חיבור":syncState==="busy"?"מסנכרן…":"…"}
function inviteLink(){return APP_URL+"#join-"+tripId}
async function invite(){
  const link=inviteLink();const text="הצטרף לטיול שלנו בחצי־חצי ("+(state.settings?.name||"")+"): "+link;
  if(navigator.share){try{await navigator.share({text});return}catch(e){if(e&&e.name==="AbortError")return}}
  try{await navigator.clipboard.writeText(link);toast("הקישור הועתק. שלחו אותו לחבר")}catch(e){const el=$("#inv-link");if(el){el.focus();el.select()}toast("סמנו והעתיקו את הקישור")}
}
function checkJoin(){
  const m=location.hash.match(/^#join-([A-Za-z0-9_-]{16,64})$/);if(!m)return;
  const id=m[1];history.replaceState(null,"",location.pathname);
  if(id===tripId)return;
  const doJoin=()=>{tripId=id;state={settings:null,expenses:[],deleted:{}};saveLocal();$("#layer").innerHTML="";render();joining=true;syncNow().then(()=>{joining=false;render();if(state.settings)toast("הצטרפת לטיול ✓");else toast("לא הצלחתי להוריד את הטיול. בדקו חיבור לאינטרנט")})};
  if(!state.settings||!state.expenses.length){doJoin();return}
  $("#layer").innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="הצטרפות לטיול"><h2>להצטרף לטיול של החבר?</h2>
    <p>בטלפון הזה כבר יש טיול ("${esc(state.settings.name)}", ${state.expenses.length} הוצאות). אם תצטרפו, הוא יוחלף בטיול המשותף.</p>
    <button class="btn" id="j-yes">הצטרפות לטיול המשותף</button><button class="btn ghost" id="j-no">להישאר בטיול שלי</button></div></div>`;
  $("#j-yes").onclick=doJoin;$("#j-no").onclick=()=>{$("#layer").innerHTML=""};
}
let joining=false;

function base(){return state.settings?.base||"ILS"}
function fmt(v,cur){cur=cur||base();const c=CURRENCIES[cur]||{s:cur};const dec=Math.abs(v)>=1000||cur==="JPY"||cur==="HUF"||cur==="VND"?0:2;
  let s=Math.abs(v).toLocaleString("he-IL",{minimumFractionDigits:Number.isInteger(Math.round(Math.abs(v)*100)/100)?0:dec,maximumFractionDigits:dec});
  return (v<0?"-":"")+c.s+s}
function inBase(e){return (Number(e.amount)||0)*(Number(e.rate)||1)}
function people(){return state.settings?.people||[]}

function compute(){
  const P=people();const paid=P.map(()=>0),owed=P.map(()=>0);let total=0;const byCat={};
  for(const e of state.expenses){
    const v=inBase(e);const fw=(e.forWhom&&e.forWhom.length?e.forWhom:P.map((_,i)=>i)).filter(i=>i<P.length);
    if(e.paidBy>=P.length||!fw.length)continue;
    paid[e.paidBy]+=v;fw.forEach(i=>owed[i]+=v/fw.length);
    if(e.kind!=="transfer"){total+=v;byCat[e.cat||"other"]=(byCat[e.cat||"other"]||0)+v}
  }
  const net=P.map((_,i)=>paid[i]-owed[i]);
  // spending per person (excluding transfers)
  const spent=P.map(()=>0);
  for(const e of state.expenses){if(e.kind==="transfer")continue;const fw=(e.forWhom&&e.forWhom.length?e.forWhom:P.map((_,i)=>i)).filter(i=>i<P.length);if(!fw.length)continue;fw.forEach(i=>spent[i]+=inBase(e)/fw.length)}
  // settlement
  const cr=[],dr=[];net.forEach((v,i)=>{const r=Math.round(v*100)/100;if(r>0.009)cr.push([i,r]);else if(r<-0.009)dr.push([i,-r])});
  cr.sort((a,b)=>b[1]-a[1]);dr.sort((a,b)=>b[1]-a[1]);
  const tr=[];let a=0,b=0;
  while(a<dr.length&&b<cr.length){const m=Math.min(dr[a][1],cr[b][1]);tr.push({from:dr[a][0],to:cr[b][0],amt:Math.round(m*100)/100});dr[a][1]-=m;cr[b][1]-=m;if(dr[a][1]<0.01)a++;if(cr[b][1]<0.01)b++}
  return {paid,net,spent,total,byCat,tr};
}

/* ---- helpers ---- */
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dayLabel(iso){if(!iso)return"";const d=new Date(iso+"T12:00:00");const t=today();if(iso===t)return"היום";
  const y=new Date();y.setDate(y.getDate()-1);const yi=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");if(iso===yi)return"אתמול";
  return d.toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long"})}

/* ---- render ---- */
function render(){
  const app=$("#app");
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  const s=state.settings;
  const head=`<header class="top"><div class="brand"><h1>חצי־חצי</h1><span class="trip">${esc(s?.name||"")}</span></div>${s?`<button class="sync ${syncState==="ok"?"on":syncState==="off"?"off":""}" id="sync-badge" style="border:0" data-goshare>${syncLabel()}</button>`:""}</header>`;
  if(!s){$("#fab").hidden=true;$("#tabs").hidden=true;app.innerHTML=head+(joining?`<section class="card empty"><div class="stamp">⏳</div><h2>מוריד את הטיול…</h2></section>`:setupView());if(!joining)bindSetup();return}
  $("#tabs").hidden=false;$("#fab").hidden=tab==="set";
  const c=compute();
  if(tab==="list")app.innerHTML=head+heroView(c)+listView();
  else if(tab==="sum")app.innerHTML=head+sumView(c);

}

function verdict(c){
  const P=people();
  if(!state.expenses.length)return"עוד אין הוצאות";
  if(!c.tr.length)return"אתם מאוזנים ✓";
  if(c.tr.length===1){const t=c.tr[0];return`${esc(P[t.from])} מעביר/ה ל${esc(P[t.to])} <span class="num">${fmt(t.amt)}</span>`}
  return`${c.tr.length} העברות לסגירת החשבון`;
}
function heroView(c){

  };

function bind(){
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openSheet(state.expenses.find(e=>e.id===b.dataset.edit)));
  document.querySelectorAll("[data-act=add]").forEach(b=>b.onclick=()=>openSheet());
  document.querySelectorAll("[data-settle]").forEach(b=>b.onclick=async()=>{
    const t=compute().tr[+b.dataset.settle];if(!t)return;
    await safe(store.putExpense({id:uid(),kind:"transfer",amount:t.amt,currency:base(),rate:1,paidBy:t.from,forWhom:[t.to],date:today(),createdAt:Date.now(),desc:"החזר"}));
    toast("נרשמה העברה ✓");
  });
  const s=state.settings;
  const act=(n,f)=>{const el=document.querySelector(`[data-act=${n}]`);if(el)el.onclick=f};
  act("addp",()=>{readSettingsForm();s.people.push("משתתף "+(s.people.length+1));render()});

  act("saveset",async()=>{readSettingsForm();if(new Set(s.people).size!==s.people.length){toast("שני משתתפים עם אותו שם");return}await safe(store.saveSettings({...s}));toast("נשמר ✓")});
  act("addcur",()=>{const c=$("#r-new").value;if(!c)return;readRates();s.rates={...(s.rates||{}),[c]:+(((DEFAULT_RATES[c]||1)/(DEFAULT_RATES[s.base]||1)).toPrecision(4))};render()});

  act("saverates",async()=>{readRates();await safe(store.saveSettings({...s}));toast("השערים נשמרו ✓")});
  act("reset",()=>{const z=$("#reset-zone");z.innerHTML=`<div class="confirm"><span>למחוק ${state.expenses.length} רשומות? אי אפשר לבטל.</span><button class="btn danger sm" id="rs-yes">כן, למחוק</button><button class="btn ghost sm" id="rs-no">ביטול</button></div>`;
    $("#rs-no").onclick=render;$("#rs-yes").onclick=async()=>{for(const e of [...state.expenses])await safe(store.delExpense(e.id));toast("נמחק")}});
}
function readSettingsForm(){const s=state.settings;const n=$("#s-name");if(n)s.name=n.value.trim()||s.name;s.people=s.people.map((p,i)=>{const el=$("#s-p"+i);return el?(el.value.trim()||p):p})}
function readRates(){const s=state.settings;s.rates={...(s.rates||{})};Object.keys(s.rates).forEach(c=>{const el=$("#r-"+c);if(el){const v=parseFloat(el.value.replace(",","."));if(v>0)s.rates[c]=v}})}
async function safe(p){try{await p}catch(e){toast("השמירה נכשלה, נסו שוב")}}

/* ---- add / edit sheet ---- */
function openSheet(exp){
  const s=state.settings,P=s.people;
  const isNew=!exp;
  const e=exp?{...exp}:{id:uid(),kind:"expense",amount:"",currency:prefs.lastCurrency||s.base,paidBy:prefs.lastPayer??0,forWhom:P.map((_,i)=>i),cat:"food",date:today(),desc:""};
  if(!e.forWhom||!e.forWhom.length)e.forWhom=P.map((_,i)=>i);
  const curs=[s.base,...Object.keys(s.rates||{}).filter(c=>c!==s.base)];if(!curs.includes(e.currency))curs.push(e.currency);
  const isT=e.kind==="transfer";
  $("#layer").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${isNew?"הוצאה חדשה":"עריכה"}">
    <div class="section-h"><h2>${isNew?"הוצאה חדשה":isT?"עריכת העברה":"עריכת הוצאה"}</h2><button class="x" id="sh-x" aria-label="סגירה">✕</button></div>
    <div class="amount-row"><input class="inp amt" id="e-amt" inputmode="decimal" placeholder="0" value="${esc(e.amount)}" aria-label="סכום">
      <select class="inp" id="e-cur" aria-label="מטבע">${curs.map(c=>`<option value="${c}" ${c===e.currency?"selected":""}>${CURRENCIES[c]?.s||""} ${c}</option>`).join("")}</select></div>
    <p class="hint" id="e-conv"></p>
    ${isT?"":`<label class="f">על מה?<input class="inp" id="e-desc" placeholder="ארוחת ערב, מונית לשדה…" value="${esc(e.desc)}" maxlength="60"></label>
    <div class="cats" role="group" aria-label="קטגוריה">${CATS.map(c=>`<button type="button" data-cat="${c[0]}" aria-pressed="${e.cat===c[0]}"><span class="e">${c[1]}</span>${c[2]}</button>`).join("")}</div>`}
    <div class="f" style="display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px">${isT?"מי העביר":"מי שילם"}<div class="seg" id="e-payer">${P.map((p,i)=>`<button type="button" data-p="${i}" aria-pressed="${e.paidBy===i}">${esc(p)}</button>`).join("")}</div></div>
    <div class="f" style="display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px">${isT?"למי":"עבור מי (מתחלק שווה)"}<div class="seg" id="e-for">${P.map((p,i)=>`<button type="button" data-f="${i}" aria-pressed="${e.forWhom.includes(i)}">${esc(p)}</button>`).join("")}</div></div>
    <div class="row2"><label class="f">תאריך<input class="inp" type="date" id="e-date" value="${esc(e.date)}"></label>
      <label class="f" id="e-rate-wrap">שער ל־${s.base}<input class="inp num" style="display:block" id="e-rate" inputmode="decimal"></label></div>
    <p class="err" id="e-err" hidden></p>
    <button class="btn" id="e-save">${isNew?"הוספה":"שמירה"}</button>
    ${isNew?"":`<div id="del-zone"><button class="btn danger" id="e-del" style="width:100%">מחיקה</button></div>`}
  </div></div>`;
  const amt=$("#e-amt"),cur=$("#e-cur"),rate=$("#e-rate");
  let rateTouched=!isNew;
  function rateFor(c){return c===s.base?1:(s.rates?.[c]??DEFAULT_RATES[c]??1)}
  rate.value=e.currency===s.base?1:(e.rate??rateFor(e.currency));
  function upd(){const c=cur.value;$("#e-rate-wrap").hidden=c===s.base;if(!rateTouched)rate.value=rateFor(c);
    const a=parseFloat(String(amt.value).replace(",","."));const r=c===s.base?1:parseFloat(String(rate.value).replace(",","."));
    const fw=e.forWhom.length;let t="";
    if(a>0&&r>0){t=(c!==s.base?`≈ ${fmt(a*r)} · `:"")+(fw>1&&!isT?`${fmt(a*r/fw)} לכל אחד`:"")}
    $("#e-conv").textContent=t;$("#e-conv").hidden=!t}
  amt.oninput=upd;rate.oninput=()=>{rateTouched=true;upd()};cur.onchange=()=>{rateTouched=false;upd()};upd();
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{e.cat=b.dataset.cat;document.querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{e.paidBy=+b.dataset.p;document.querySelectorAll("[data-p]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const i=+b.dataset.f;
    if(isT){e.forWhom=[i]}else{e.forWhom=e.forWhom.includes(i)?e.forWhom.filter(x=>x!==i):[...e.forWhom,i].sort()}
    document.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",e.forWhom.includes(+x.dataset.f)));upd()});
  const close=()=>{$("#layer").innerHTML=""};
  $("#sh-x").onclick=close;$("#scrim").onclick=ev=>{if(ev.target.id==="scrim")close()};
  document.addEventListener("keydown",function k(ev){if(ev.key==="Escape"){close();document.removeEventListener("keydown",k)}});
  $("#e-save").onclick=async()=>{
    const err=$("#e-err");const a=parseFloat(String(amt.value).replace(",","."));const c=cur.value;const r=c===s.base?1:parseFloat(String(rate.value).replace(",","."));
    if(!(a>0)){err.textContent="צריך להזין סכום גדול מאפס.";err.hidden=false;amt.focus();return}
    if(!(r>0)){err.textContent="שער המטבע לא תקין.";err.hidden=false;return}
    if(!e.forWhom.length){err.textContent="צריך לבחור לפחות אדם אחד שההוצאה עבורו.";err.hidden=false;return}
    if(isT&&e.forWhom[0]===e.paidBy){err.textContent="אי אפשר להעביר כסף לעצמך.";err.hidden=false;return}
    const out={...e,amount:Math.round(a*100)/100,currency:c,rate:r,date:$("#e-date").value||today(),createdAt:e.createdAt||Date.now()};
    if(!isT){out.desc=$("#e-desc").value.trim()}
    const btn=$("#e-save");btn.disabled=true;
    try{await store.putExpense(out);close();toast(isNew?"נוסף ✓":"נשמר ✓");
      if(isNew){prefs.lastCurrency=c;prefs.lastPayer=e.paidBy;saveLocal()}
    }catch(x){btn.disabled=false;err.textContent="השמירה נכשלה. נסו שוב.";err.hidden=false}
  };
  const del=$("#e-del");if(del)del.onclick=()=>{$("#del-zone").innerHTML=`<div class="confirm"><span>למחוק את הרשומה?</span><button class="btn danger sm" id="d-yes">מחיקה</button><button class="btn ghost sm" id="d-no">ביטול</button></div>`;
    $("#d-no").onclick=()=>openSheet(exp);$("#d-yes").onclick=async()=>{await safe(store.delExpense(e.id));close();toast("נמחק")}};
  if(isNew)setTimeout(()=>amt.focus(),50);
}

/* ---- boot ---- */
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;try{localStorage.setItem(LS_KEY+":tab",tab)}catch(e){}render();window.scrollTo(0,0)});
$("#fab").onclick=()=>openSheet();
loadLocal();
if(state.settings&&!tripId){tripId=newTripId();saveLocal()}
render();
checkJoin();
window.addEventListener("hashchange",checkJoin);
syncNow();
setInterval(()=>{if(document.visibilityState==="visible")syncNow()},15000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncNow()});
window.addEventListener("online",syncNow);

if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
})();
</script>
</body>
</html>
