<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

<style>
/* Layout: one-column phone app. Sticky header with the trip total, list of expenses as "receipt" rows, bottom tab bar, add-sheet slides up. */
:root{
  --bg:#eef3f4; --surface:#ffffff; --ink:#14262e; --muted:#5d7178; --line:#d5e0e3;
  --accent:#0d7a6f; --accent-ink:#ffffff; --sun:#f0a92e; --sun-soft:#fdf1da;
  --good:#1f8a4c; --bad:#c2412d; --soft:#e2eeee; --toast-act:#f0a92e;
  --display:"Rubik","Arial Hebrew","Segoe UI",sans-serif;
  --body:"Assistant","Arial Hebrew","Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1a1e; --surface:#16262b; --ink:#e4eef0; --muted:#93a8ae; --line:#284047;
  --accent:#3cc1b1; --accent-ink:#06211e; --sun:#f3b84d; --sun-soft:#3a2f17;
  --good:#5fd08e; --bad:#ff7d68; --soft:#1d3237; --toast-act:#0d7a6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a1e; --surface:#16262b; --ink:#e4eef0; --muted:#93a8ae; --line:#284047;
  --accent:#3cc1b1; --accent-ink:#06211e; --sun:#f3b84d; --sun-soft:#3a2f17;
  --good:#5fd08e; --bad:#ff7d68; --soft:#1d3237; --toast-act:#0d7a6f; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink);margin:0;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{font-family:var(--body);font-size:16px;line-height:1.45;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(160px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.brand .trip{color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.sync.on{color:var(--accent)}

.linkbox{direction:ltr;font-size:13px}

.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-start:-30px;bottom:-40px;width:140px;height:140px;border:2px dashed currentColor;border-radius:50%;opacity:.18}
.hero .lbl{font-size:13px;opacity:.85;letter-spacing:.02em}
.hero .big{font-family:var(--display);font-size:34px;font-weight:800;line-height:1.1}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.16);border-radius:10px;padding:6px 10px;font-size:14px}
.hero .verdict{font-family:var(--display);font-weight:700;font-size:17px;background:var(--sun);color:#2a1d02;border-radius:12px;padding:10px 12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section-h h2{font-size:18px}
.muted{color:var(--muted)}
.small{font-size:13px}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day{padding:8px 14px;font-size:13px;color:var(--muted);background:var(--soft);font-weight:600}
.exp{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);text-align:start;background:none;border-inline:0;border-bottom:0;width:100%}
.day+.exp{border-top:0}
.exp .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--soft)}
.exp .t{min-width:0}
.exp .t b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .t span{font-size:13px;color:var(--muted)}
.exp .a{text-align:end}
.exp .a b{font-family:var(--display);font-weight:700;font-size:16px}
.exp .a span{display:block;font-size:12px;color:var(--muted)}
.exp.transfer .ic{background:var(--sun-soft)}

.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty .stamp{font-size:40px}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.5}

.fab{position:fixed;z-index:6;left:max(20px,calc(env(safe-area-inset-left,0px) + 20px),calc(50% - 280px + 4px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:20px;border:0;background:var(--sun);color:#2a1d02;font-size:32px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18);display:grid;place-items:center}

nav.tabs{position:fixed;inset:auto 0 0;z-index:7;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:flex;gap:4px;width:100%;max-width:560px}
nav.tabs button{flex:1;border:0;background:none;padding:8px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted);font-weight:600}
nav.tabs button .i{font-size:20px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--soft)}

.person-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.person-row:first-of-type{border-top:0}
.person-row .n{font-weight:700}
.person-row .bal{font-family:var(--display);font-weight:700}
.pos{color:var(--good)} .neg{color:var(--bad)}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

.transfer-card{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:12px;border-radius:12px;background:var(--sun-soft);border:1px dashed var(--sun)}
.transfer-card .who{font-weight:700;font-size:17px}
.stack{display:flex;flex-direction:column;gap:10px}

.cat-row{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:6px 0}
.cat-row .bar{grid-column:2/-1}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,15,18,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:94%;display:flex;flex-direction:column;overflow:hidden;border-radius:22px 22px 0 0;margin:0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-size:20px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px}
.amount-row{display:grid;grid-template-columns:1fr 110px;gap:8px}
.amount-row .inp.amt{font-family:var(--display);font-size:26px;font-weight:700;direction:ltr;text-align:right}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cats button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.cats button .e{font-size:20px}
.cats button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:700}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2>*{flex:1}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:14px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:10px}

.rate-row{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center}
.people-edit{display:flex;flex-direction:column;gap:8px}
.people-edit .pe{display:flex;gap:8px}
.people-edit .pe .inp{flex:1}
.x{border:0;background:var(--soft);border-radius:10px;width:44px;font-size:18px}
textarea.inp{min-height:110px;resize:vertical;font-size:14px}
#share-sec{scroll-margin-top:calc(70px + env(safe-area-inset-top,0px))}
.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(82px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:8px 8px 8px 14px;border-radius:12px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.toast span{padding-inline-start:4px}
.toast.top{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
@media (min-width:760px){.fab{left:calc(50% - 280px - 80px)}}
.toast button{border:0;background:transparent;color:var(--toast-act);font-weight:700;padding:6px 10px;border-radius:8px}

/* v3 additions */
button.brand{background:none;border:0;padding:0;text-align:start;color:inherit;cursor:pointer}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.sheet-head h2{font-size:20px}
.sheet-body{overflow:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding:4px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.sheet>.sheet-body:first-child{padding-top:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-foot{display:flex;flex-direction:column;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
div.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.f-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;padding:6px 2px;text-decoration:underline;text-underline-offset:3px}
.danger-link{color:var(--bad)}
.conv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-height:20px;font-size:14px;color:var(--muted);margin-top:-6px}
.me{font-weight:400;opacity:.8;font-size:12px}
.shares{display:flex;flex-direction:column;gap:6px}
.share-row{display:grid;grid-template-columns:1fr 140px;align-items:center;gap:8px;font-weight:600}
.share-row .inp{text-align:left;direction:ltr}
.hint.pos{color:var(--good)}
.receipt{display:flex;align-items:center;gap:12px}
.thumb img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.r-acts{display:flex;gap:12px}
.clip{font-size:13px}
.filters{display:flex;flex-direction:column;gap:8px}
.search{padding:10px 12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips .sep{flex:0 0 1px;background:var(--line);margin:4px 2px}
.ftotal{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.invite{display:flex;flex-direction:column;gap:10px;border-color:var(--accent);border-width:2px}
.invite h2{font-size:18px}
.invite p{margin:4px 0 0}
.hero .verdict{border:0;text-align:start;width:100%;cursor:pointer}
.transfer-card{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center}
.transfer-card .amt{font-family:var(--display);font-size:22px}
.transfer-card .acts{grid-column:1/-1;display:flex;gap:8px}
.transfer-card .acts .btn{flex:1}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:4px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle;background:var(--accent)}
.sw.share,.bar i.share{background:var(--sun)}
.bars{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center}
.bars .small{color:var(--muted);min-width:70px;text-align:left}
.person-row .bal{font-family:var(--display);font-weight:700;font-size:15px}
.trip-row{display:flex;gap:8px;align-items:stretch}
.trip-open{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px}
.trip-row.cur .trip-open{border-color:var(--accent);border-width:2px}
.who-pick{display:flex;flex-direction:column;gap:8px}
.who-pick .btn{font-size:18px;padding:14px}
.cats button{min-height:56px}
.seg button{min-height:40px}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>
<nav class="tabs" id="tabs" aria-label="ניווט"><div class="in">
  <button data-tab="list"><span class="i">🧾</span>הוצאות</button>
  <button data-tab="sum"><span class="i">⚖️</span>מי חייב למי</button>
  <button data-tab="set"><span class="i">⚙️</span>הגדרות</button>
</div></nav>
<button class="fab" id="fab" aria-label="הוספת הוצאה">+</button>
<div id="layer"></div>

<script>
(function(){
const CURRENCIES={ILS:{s:"₪",n:"שקל"},USD:{s:"$",n:"דולר"},EUR:{s:"€",n:"יורו"},GBP:{s:"£",n:"ליש״ט"},THB:{s:"฿",n:"באט"},JPY:{s:"¥",n:"ין"},CHF:{s:"CHF",n:"פרנק"},CZK:{s:"Kč",n:"קורונה צ׳כית"},HUF:{s:"Ft",n:"פורינט"},GEL:{s:"₾",n:"לארי"},TRY:{s:"₺",n:"לירה טורקית"},INR:{s:"₹",n:"רופי"},VND:{s:"₫",n:"דונג"},AED:{s:"د.إ",n:"דירהם"},PLN:{s:"zł",n:"זלוטי"},RON:{s:"lei",n:"לאו"},EGP:{s:"E£",n:"לירה מצרית"},JOD:{s:"JD",n:"דינר ירדני"},CAD:{s:"C$",n:"דולר קנדי"},AUD:{s:"A$",n:"דולר אוסטרלי"},MXN:{s:"MX$",n:"פסו מקסיקני"},PHP:{s:"₱",n:"פסו פיליפיני"},IDR:{s:"Rp",n:"רופיה"},LKR:{s:"Rs",n:"רופי סרי לנקי"},NPR:{s:"रू",n:"רופי נפאלי"}};
const DEFAULT_RATES={ILS:1,USD:3.7,EUR:4.0,GBP:4.7,THB:0.11,JPY:0.025,CHF:4.2,CZK:0.16,HUF:0.01,GEL:1.37,TRY:0.11,INR:0.044,VND:0.00015,AED:1.0,PLN:0.93,RON:0.8,EGP:0.076,JOD:5.2,CAD:2.7,AUD:2.4,MXN:0.2,PHP:0.064,IDR:0.00023,LKR:0.012,NPR:0.027};
const CATS=[["food","🍽️","אוכל"],["stay","🏨","לינה"],["ride","🚕","תחבורה"],["fun","🎟️","אטרקציות"],["shop","🛍️","קניות"],["fuel","⛽","דלק"],["drink","🍻","בילוי"],["other","📦","אחר"]];
const CAT=Object.fromEntries(CATS.map(c=>[c[0],c]));
const HOME_HOST="mysplit.jacob-apps.co.il";
const API=location.hostname===HOME_HOST?"/api/":"https://"+HOME_HOST+"/api/";
const APP_URL=location.origin+location.pathname;
const K="trip-split-v2";

/* ---------- storage: several trips on this phone ---------- */
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let trips=ls.get(K+":trips",[]);          // [{id,name}]
let tripId=ls.get(K+":current",null);
let state={settings:null,expenses:[],deleted:{}};
let prefs={};                              // per trip, this phone only: {me,lastCurrency,invited}
let rates=ls.get(K+":rates",null);         // {rates:{CUR:perUSD},updatedAt}
let pending=ls.get(K+":pending",{});       // receipts not uploaded yet {tripId:{rid:dataUrl}}
let tab=ls.get(K+":tab","list");
let filt={q:"",cat:"",who:""};

function newId(n){const a=new Uint8Array(n||16);crypto.getRandomValues(a);return btoa(String.fromCharCode(...a)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function migrateV1(){
  if(trips.length)return;
  const old=ls.get("trip-split-v1",null);if(!old||!old.settings)return;
  let id=null;try{id=localStorage.getItem("trip-split-v1:trip")}catch(e){}
  id=id||newId();const op=ls.get("trip-split-v1:prefs",{});
  const s=old.settings;if(!s.currencies){s.currencies=Object.keys(s.rates||{});s.manual={};delete s.rates}
  ls.set(K+":t:"+id,{settings:s,expenses:old.expenses||[],deleted:old.deleted||{}});
  ls.set(K+":p:"+id,{me:op.lastPayer??0,lastCurrency:op.lastCurrency});
  trips=[{id,name:s.name}];tripId=id;ls.set(K+":trips",trips);ls.set(K+":current",id);
}
function loadTrip(id){
  tripId=id;const d=id?ls.get(K+":t:"+id,null):null;
  state=d?{settings:d.settings||null,expenses:d.expenses||[],deleted:d.deleted||{}}:{settings:null,expenses:[],deleted:{}};
  if(state.settings&&!state.settings.currencies){state.settings.currencies=Object.keys(state.settings.rates||{});state.settings.manual={};delete state.settings.rates}
  prefs=id?ls.get(K+":p:"+id,{}):{};ls.set(K+":current",id);
  filt={q:"",cat:"",who:""};
}
function saveLocal(){
  if(!tripId)return;ls.set(K+":t:"+tripId,state);ls.set(K+":p:"+tripId,prefs);
  const t=trips.find(x=>x.id===tripId);const name=state.settings?.name||"";
  if(t){if(t.name!==name&&name){t.name=name;ls.set(K+":trips",trips)}}
  else if(state.settings){trips.push({id:tripId,name});ls.set(K+":trips",trips)}
}

/* ---------- store: every change goes through here ---------- */
const store={
  saveSettings(s){s.updatedAt=Date.now();state.settings=s;saveLocal();render();syncSoon()},
  putExpense(e){e.updatedAt=Date.now();const i=state.expenses.findIndex(x=>x.id===e.id);if(i>=0)state.expenses[i]=e;else state.expenses.push(e);saveLocal();render();syncSoon()},
  delExpense(id){state.expenses=state.expenses.filter(x=>x.id!==id);state.deleted[id]=Date.now();saveLocal();render();syncSoon()}
};

/* ---------- sync ---------- */
const ts=e=>Number(e?.updatedAt||e?.createdAt||0);
function merge(a,b){
  const deleted={...(a.deleted||{})};Object.entries(b.deleted||{}).forEach(([k,v])=>{if(!deleted[k]||deleted[k]<v)deleted[k]=v});
  const byId=new Map();for(const e of [...(a.expenses||[]),...(b.expenses||[])]){if(!e||typeof e.id!=="string")continue;const c=byId.get(e.id);if(!c||ts(e)>ts(c))byId.set(e.id,e)}
  for(const [id,t] of Object.entries(deleted)){const c=byId.get(id);if(c&&t>=ts(c))byId.delete(id)}
  const sa=a.settings,sb=b.settings;const settings=!sa?sb||null:!sb?sa:(Number(sb.updatedAt||0)>Number(sa.updatedAt||0)?sb:sa);
  return {settings,expenses:[...byId.values()],deleted};
}
let syncState="idle",lastSync=0,syncing=false,again=false,syncTimer=null;
function syncSoon(){clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,400)}
async function syncNow(){
  if(!tripId)return;
  if(syncing){again=true;return}
  syncing=true;setSync("busy");const id=tripId;
  try{
    const r=await fetch(API+"trips/"+encodeURIComponent(id)+"/sync",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(state),signal:AbortSignal.timeout?AbortSignal.timeout(12000):undefined});
    if(!r.ok)throw new Error("http "+r.status);
    const remote=await r.json();
    if(id!==tripId)return;                 // switched trips meanwhile
    const before=JSON.stringify([state.settings,state.expenses]);
    const m=merge(state,remote);state.settings=m.settings||state.settings;state.expenses=m.expenses;state.deleted=m.deleted;
    if(state.settings&&!state.settings.currencies){state.settings.currencies=[];state.settings.manual={}}
    saveLocal();lastSync=Date.now();setSync("ok");
    if(location.hostname.endsWith("github.io")&&state.settings){location.replace("https://"+HOME_HOST+"/#join-"+tripId);return}
    uploadPending();
    if(JSON.stringify([state.settings,state.expenses])!==before&&!isBusy())render();
  }catch(e){setSync("off")}
  finally{syncing=false;if(again){again=false;syncSoon()}}
}
function isBusy(){const a=document.activeElement;return (a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT")&&$("#app").contains(a))}
function setSync(st){syncState=st;const b=$("#sync-badge");if(b){b.className="sync "+(st==="ok"?"on":"");b.textContent=syncLabel()}}
function syncLabel(){return syncState==="ok"?"● מסונכרן":syncState==="off"?"שמור בטלפון":syncState==="busy"?"מסנכרן…":"…"}

/* ---------- exchange rates ---------- */
async function loadRates(){
  if(rates&&Date.now()-(rates.fetchedAt||0)<3*3600_000)return;
  try{const r=await fetch(API+"rates");if(!r.ok)throw 0;const j=await r.json();if(j&&j.rates&&j.rates.ILS){rates={rates:j.rates,updatedAt:j.updatedAt,fetchedAt:Date.now()};ls.set(K+":rates",rates);if(tab==="set"&&!isBusy())render()}}catch(e){}
}
function autoRate(cur,b){b=b||base();if(cur===b)return 1;const R=rates?.rates;if(R&&R[cur]&&R[b])return R[b]/R[cur];return null}
function rateFor(cur){const s=state.settings;if(cur===base())return 1;const m=s?.manual?.[cur];if(m>0)return m;const a=autoRate(cur);if(a)return a;return (DEFAULT_RATES[cur]||1)/(DEFAULT_RATES[base()]||1)}
function rateSource(cur){if(cur===base())return"";if(state.settings?.manual?.[cur]>0)return"ידני";if(autoRate(cur))return"אוטומטי";return"משוער"}
function niceRate(r){return r>=100?r.toFixed(0):r>=1?(+r.toFixed(3)).toString():(+r.toPrecision(3)).toString()}

/* ---------- receipts ---------- */
function receiptUrl(rid,tid){tid=tid||tripId;const p=pending[tid]?.[rid];return p||API+"trips/"+encodeURIComponent(tid)+"/receipts/"+rid}
async function uploadPending(){
  const mine=pending[tripId];if(!mine)return;
  for(const [rid,data] of Object.entries(mine)){
    try{const blob=await (await fetch(data)).blob();const r=await fetch(API+"trips/"+encodeURIComponent(tripId)+"/receipts/"+rid,{method:"PUT",headers:{"content-type":"image/jpeg"},body:blob});
      if(r.ok){delete mine[rid];ls.set(K+":pending",pending)}}catch(e){return}
  }
  if(!Object.keys(mine).length){delete pending[tripId];ls.set(K+":pending",pending)}
}
function shrinkImage(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const max=1400;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.72))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"))};img.src=url})}

/* ---------- money ---------- */
function base(){return state.settings?.base||"ILS"}
function fmt(v,cur){cur=cur||base();const c=CURRENCIES[cur]||{s:cur};const big=Math.abs(v)>=1000||["JPY","HUF","VND","IDR"].includes(cur);
  const r=Math.round(Math.abs(v)*100)/100;const s=r.toLocaleString("he-IL",{minimumFractionDigits:big||Number.isInteger(r)?0:2,maximumFractionDigits:big?0:2});
  return (v<0?"-":"")+c.s+s}
function inBase(e){return (Number(e.amount)||0)*(Number(e.rate)||1)}
function people(){return state.settings?.people||[]}
function shareOf(e,P){ // in base currency, per person index
  const out=P.map(()=>0);const v=inBase(e);
  if(e.shares&&e.kind!=="transfer"){Object.entries(e.shares).forEach(([i,a])=>{if(+i<P.length)out[+i]+=(Number(a)||0)*(Number(e.rate)||1)});return out}
  const fw=(e.forWhom&&e.forWhom.length?e.forWhom:P.map((_,i)=>i)).filter(i=>i<P.length);fw.forEach(i=>out[i]+=v/fw.length);return out;
}
function compute(){
  const P=people();const paid=P.map(()=>0),owed=P.map(()=>0),spent=P.map(()=>0),paidExp=P.map(()=>0);let total=0;const byCat={};
  for(const e of state.expenses){
    if(!(e.paidBy<P.length))continue;const v=inBase(e);const sh=shareOf(e,P);
    paid[e.paidBy]+=v;sh.forEach((x,i)=>owed[i]+=x);
    if(e.kind!=="transfer"){total+=v;paidExp[e.paidBy]+=v;sh.forEach((x,i)=>spent[i]+=x);byCat[e.cat||"other"]=(byCat[e.cat||"other"]||0)+v}
  }
  const net=P.map((_,i)=>paid[i]-owed[i]);
  const cr=[],dr=[];net.forEach((v,i)=>{const r=Math.round(v*100)/100;if(r>0.009)cr.push([i,r]);else if(r<-0.009)dr.push([i,-r])});
  cr.sort((a,b)=>b[1]-a[1]);dr.sort((a,b)=>b[1]-a[1]);
  const tr=[];let a=0,b=0;
  while(a<dr.length&&b<cr.length){const m=Math.min(dr[a][1],cr[b][1]);tr.push({from:dr[a][0],to:cr[b][0],amt:Math.round(m*100)/100});dr[a][1]-=m;cr[b][1]-=m;if(dr[a][1]<0.01)a++;if(cr[b][1]<0.01)b++}
  return {paid,paidExp,net,spent,total,byCat,tr};
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);const $$=s=>document.querySelectorAll(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
let toastTimer=null;
function toast(msg,undo){const old=$("#toast");if(old)old.remove();clearTimeout(toastTimer);
  const t=document.createElement("div");t.id="toast";t.className="toast"+($(".scrim")?" top":"");t.setAttribute("role","status");
  t.innerHTML=`<span>${esc(msg)}</span>${undo?`<button type="button">ביטול</button>`:""}`;document.body.appendChild(t);
  if(undo)t.querySelector("button").onclick=()=>{t.remove();undo()};
  toastTimer=setTimeout(()=>t.remove(),undo?5000:2200)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return iso(new Date())}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return iso(d)}
function dayLabel(x){if(!x)return"";if(x===today())return"היום";if(x===yesterday())return"אתמול";return new Date(x+"T12:00:00").toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long"})}
function count(n,one,many){return n===1?one:n+" "+many}
function from(name){return "מ"+name}  // "מיעקב"
function to(name){return "ל"+name}
function me(){return prefs.me??null}

/* ---------- render ---------- */
function render(){
  const app=$("#app");
  $$("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  const s=state.settings;
  const head=`<header class="top"><button class="brand" data-act="trips" aria-label="הטיולים שלי"><h1>חצי־חצי</h1><span class="trip">${esc(s?.name||"")}${trips.length?" ▾":""}</span></button>${s?`<span class="sync ${syncState==="ok"?"on":""}" id="sync-badge">${syncLabel()}</span>`:""}</header>`;
  if(!s){$("#fab").hidden=true;$("#tabs").hidden=true;app.innerHTML=head+(joining?`<section class="card empty"><div class="stamp">⏳</div><h2>מוריד את הטיול…</h2></section>`:setupView());if(!joining)bindSetup();bindCommon();return}
  $("#tabs").hidden=false;$("#fab").hidden=tab==="set";
  const c=compute();
  if(tab==="list")app.innerHTML=head+inviteCard()+(state.expenses.length?heroView(c):"")+listView();
  else if(tab==="sum")app.innerHTML=head+sumView(c);
  else app.innerHTML=head+settingsView();
  bind();bindCommon();
  if(s&&me()==null&&!$("#layer").innerHTML)askWho();
}

function inviteCard(){
  if(prefs.invited||people().length<2)return"";
  return`<section class="card invite"><div><h2>להזמין את ${esc(people().find((_,i)=>i!==me())||"החבר")}?</h2><p class="muted small">שלחו קישור, וכל הוצאה שאחד מכם מוסיף תופיע אצל השני.</p></div>
    <div class="row2"><button class="btn" data-act="invite">שליחת קישור</button><button class="btn ghost" data-act="invited">כבר הצטרף</button></div></section>`;
}
function verdict(c){
  const P=people();
  if(!c.tr.length)return"אתם מאוזנים ✓";
  if(c.tr.length===1){const t=c.tr[0];return`${esc(from(P[t.from]))} ${esc(to(P[t.to]))}: <span class="num">${fmt(t.amt)}</span>`}

}
function heroView(c){

function matches(e){
  const P=people();
  if(filt.cat&&(e.kind==="transfer"?"transfer":e.cat||"other")!==filt.cat)return false;
  if(filt.who!==""&&e.paidBy!==+filt.who)return false;
  if(filt.q){const q=filt.q.trim().toLowerCase();const txt=[e.desc,CAT[e.cat]?.[2],P[e.paidBy],String(e.amount)].join(" ").toLowerCase();if(!txt.includes(q))return false}
  return true;
}
function listView(){
  const P=people();
  if(!state.expenses.length)return`<section class="card empty"><div class="stamp">🧳</div><h2>הטיול מתחיל כאן</h2><p class="muted">כל הוצאה שתוסיפו תופיע כאן, עם מי שילם ובאיזה מטבע. בסוף תראו בדיוק מי מעביר למי.</p><button class="btn" data-act="add">הוספת הוצאה ראשונה</button></section>`;
  const usedCats=[...new Set(state.expenses.map(e=>e.kind==="transfer"?"transfer":e.cat||"other"))];
  const filtered=state.expenses.filter(matches);
  const active=filt.q||filt.cat||filt.who!=="";
  const sorted=[...filtered].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
  let out="",last=null;
  for(const e of sorted){
    if(e.date!==last){const dayTotal=sorted.filter(x=>x.date===e.date&&x.kind!=="transfer").reduce((s,x)=>s+inBase(x),0);
      out+=`<div class="day">${esc(dayLabel(e.date))}${dayTotal?` · <span class="num">${fmt(dayTotal)}</span>`:""}</div>`;last=e.date}

  }

    <div class="chips" role="group" aria-label="סינון">

    </div></div>
  ${active?`<div class="ftotal"><span>${count(filtered.length,"תוצאה אחת","תוצאות")} · סה״כ <b class="num">${fmt(fTotal)}</b></span><button class="linkbtn" data-act="clearf">ניקוי סינון</button></div>`:""}
  ${sorted.length?`<section class="list">${out}</section>`:`<section class="card empty"><p class="muted">אין הוצאות שמתאימות לסינון.</p></section>`}`;

function inviteLink(){return APP_URL+"#join-"+tripId}
async function invite(){
  const link=inviteLink();const text="הצטרפות לטיול שלנו בחצי־חצי ("+(state.settings?.name||"")+"): "+link;
  prefs.invited=true;saveLocal();
  if(navigator.share){try{await navigator.share({text});render();return}catch(e){if(e&&e.name==="AbortError")return}}
  try{await navigator.clipboard.writeText(link);toast("הקישור הועתק. שלחו אותו לחבר")}catch(e){setTab("set");const el=$("#inv-link");if(el){el.focus();el.select()}toast("סמנו והעתיקו את הקישור")}
  render();
}
let joining=false;
function checkJoin(){
  const m=location.hash.match(/^#join-([A-Za-z0-9_-]{16,64})$/);if(!m)return;
  const id=m[1];history.replaceState(null,"",location.pathname);
  if(trips.some(t=>t.id===id)){loadTrip(id);render();syncNow();return}
  // keep the current trip in "my trips", open the shared one
  loadTrip(id);prefs={invited:true};joining=true;render();
  syncNow().then(()=>{joining=false;
    if(state.settings){saveLocal();render();toast("הצטרפת לטיול")}
    else{trips=trips.filter(t=>t.id!==id);ls.set(K+":trips",trips);const prev=trips[trips.length-1];loadTrip(prev?prev.id:null);render();toast("לא הצלחתי להוריד את הטיול. בדקו חיבור ונסו שוב את הקישור")}
  });
}

    <div class="f">${isT?"מי העביר":"מי שילם"}<div class="seg" id="e-payer">${P.map((p,i)=>`<button type="button" data-p="${i}" aria-pressed="${e.paidBy===i}">${meName(i)}</button>`).join("")}</div></div>
    ${isT?"":`<label class="f">על מה?<input class="inp" id="e-desc" enterkeyhint="done" placeholder="ארוחת ערב, מונית לשדה…" value="${esc(e.desc)}" maxlength="60"></label>

    $$("[data-f]").forEach(x=>x.setAttribute("aria-pressed",e.forWhom.includes(+x.dataset.f)));upd()});
  const un=$("#e-uneven");if(un)un.onclick=()=>{uneven=!uneven;un.textContent=uneven?"חלוקה שווה":"חלוקה לא שווה";$("#e-for").hidden=uneven;$("#e-shares").hidden=!uneven;
    if(uneven){const a=num(amt.value);if(a>0&&![...$$("[data-sh]")].some(el=>el.value)){const each=Math.floor(a/P.length*100)/100;$$("[data-sh]").forEach((el,k)=>el.value=k===P.length-1?Math.round((a-each*(P.length-1))*100)/100:each)}}upd()};
  $$("[data-sh]").forEach(el=>el.oninput=upd);
  $$("[data-day]").forEach(b=>b.onclick=()=>{const m=b.dataset.day;$$("[data-day]").forEach(x=>x.setAttribute("aria-pressed",x===b));const d=$("#e-date");
    if(m==="today")d.value=today();else if(m==="yesterday")d.value=yesterday();d.hidden=m!=="other";if(m==="other")d.focus()});
  // receipt
  let receipt=e.receipt||null,newReceipt=null;
  function drawReceipt(){const z=$("#e-receipt");if(!z)return;
    const src=newReceipt||(receipt?receiptUrl(receipt):null);
    z.innerHTML=src?`<a href="${esc(src)}" target="_blank" rel="noopener" class="thumb"><img src="${esc(src)}" alt="קבלה"></a><div class="r-acts"><button type="button" class="linkbtn" id="r-change">החלפה</button><button type="button" class="linkbtn danger-link" id="r-del">הסרה</button></div>`
      :`<button type="button" class="btn ghost sm" id="r-add">📷 צירוף צילום קבלה</button>`;
    const pick=()=>$("#e-file").click();const a=$("#r-add");if(a)a.onclick=pick;const ch=$("#r-change");if(ch)ch.onclick=pick;
    const d=$("#r-del");if(d)d.onclick=()=>{receipt=null;newReceipt=null;drawReceipt()}}
  const file=$("#e-file");if(file)file.onchange=async()=>{const f=file.files[0];if(!f)return;try{newReceipt=await shrinkImage(f);drawReceipt()}catch(x){toast("לא הצלחתי לקרוא את התמונה")}file.value=""};
  drawReceipt();
  upd();
  const close=()=>{$("#layer").innerHTML=""};
  $("#sh-x").onclick=close;$("#scrim").onclick=ev=>{if(ev.target.id==="scrim")close()};
  document.addEventListener("keydown",function k(ev){if(ev.key==="Escape"){close();document.removeEventListener("keydown",k)}});
  [amt,$("#e-desc")].forEach(el=>{if(el)el.onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();$("#sheet").requestSubmit()}}});
  $("#sheet").onsubmit=ev=>{ev.preventDefault();
    const err=$("#e-err");const showErr=(m,el)=>{err.textContent=m;err.hidden=false;if(el)el.focus()};
    const a=num(amt.value);const c=cur.value;const r=c===s.base?1:rate;
    if(!(a>0))return showErr("צריך להזין סכום גדול מאפס.",amt);
    if(!(r>0))return showErr("שער המטבע לא תקין.");
    let shares=null;
    if(uneven){shares={};let sum=0;$$("[data-sh]").forEach(el=>{const v=num(el.value)||0;if(v>0){shares[el.dataset.sh]=Math.round(v*100)/100;sum+=v}});
      if(Math.abs(sum-a)>0.009)return showErr(`סכום החלקים (${fmt(sum,c)}) צריך להיות שווה לסכום ההוצאה (${fmt(a,c)}).`)}
    else if(!e.forWhom.length)return showErr("צריך לבחור לפחות אדם אחד שההוצאה עבורו.");
    if(isT&&e.forWhom[0]===e.paidBy)return showErr("אי אפשר להעביר כסף לעצמך.");
    const out={...e,amount:Math.round(a*100)/100,currency:c,rate:r,date:$("#e-date").value||today(),createdAt:e.createdAt||Date.now()};
    if(shares){out.shares=shares;out.forWhom=Object.keys(shares).map(Number).sort()}else delete out.shares;
    if(!isT)out.desc=$("#e-desc").value.trim();
    if(newReceipt){const rid=newId(12);(pending[tripId]=pending[tripId]||{})[rid]=newReceipt;ls.set(K+":pending",pending);out.receipt=rid}
    else if(receipt)out.receipt=receipt;else delete out.receipt;
    const prev=exp?JSON.parse(JSON.stringify(exp)):null;
    close();store.putExpense(out);
    if(isNew){prefs.lastCurrency=c;saveLocal();toast("נוסף",()=>store.delExpense(out.id))}
    else toast("נשמר",()=>store.putExpense(prev));
  };
  const del=$("#e-del");if(del)del.onclick=()=>{const gone=JSON.parse(JSON.stringify(exp));close();store.delExpense(gone.id);toast("נמחק",()=>{delete state.deleted[gone.id];store.putExpense(gone)})};
  if(isNew)setTimeout(()=>amt.focus(),60);
}
// keep the sheet above the on-screen keyboard
function fitSheet(){const vv=window.visualViewport;const sc=$("#scrim");if(!vv||!sc)return;sc.style.height=vv.height+"px";sc.style.top=vv.offsetTop+"px"}
if(window.visualViewport){visualViewport.addEventListener("resize",fitSheet);visualViewport.addEventListener("scroll",fitSheet)}

/* ---------- boot ---------- */
function setTab(t){tab=t;ls.set(K+":tab",t);render();window.scrollTo(0,0)}
$$("#tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$("#fab").onclick=()=>openSheet();
migrateV1();
loadTrip(tripId&&trips.some(t=>t.id===tripId)?tripId:(trips[trips.length-1]?.id||null));
render();
checkJoin();
window.addEventListener("hashchange",checkJoin);
syncNow();loadRates();
setInterval(()=>{if(document.visibilityState==="visible")syncNow()},15000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){syncNow();loadRates()}});
window.addEventListener("online",()=>{syncNow();loadRates()});

if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
})();
</script>
